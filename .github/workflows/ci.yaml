name: Release

on:
  create:

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      -
        name: "Fetch latest tag"
        id: get-latest-tag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
      -
        name: Build and push Postgres 18 TimescaleDB
        id: docker_build_18_timescaledb
        uses: docker/build-push-action@v6
        with:
          build-args: |
            PG_VERSION=18.1
            PG_MAJOR_VERSION=18
            VERSION=${{ steps.get-latest-tag.outputs.tag }}
          context: .
          file: ./pg18/Dockerfile-timescaledb
          push: true
          tags: |
            ghcr.io/kimotodev/postgres-flex:18
            ghcr.io/kimotodev/postgres-flex:18.1
      -
        name: Postgres 18 TimescaleDB Image digest
        run: echo ${{ steps.docker_build_18_timescaledb.outputs.digest }}
